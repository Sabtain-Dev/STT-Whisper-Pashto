[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Ignore rules that conflict with standard FastAPI & Streamlit conventions
ignore = [
    "B008",    # Allow FastAPI Depends() and File() in default function arguments
    "BLE001",   # Allow catching generic Exception in try/except blocks
    "DTZ005",   # Allow datetime.now() without explicit timezone
    "S110",    # Allow try-except-pass
    "S112",    # Allow try-except-continue
]

[tool.ruff.lint.per-file-ignores]
"app/app.py" = ["RUF059", "SIM117"] # Ignore unused unpacked UI loop variables in Streamlit