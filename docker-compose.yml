# docker-compose.yml
# Note: no top-level `version:` key — Docker Desktop's bundled Compose V2
# uses the Compose Specification, which doesn't need it (and warns that
# it's obsolete if present).

services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: pashto_whisper_backend
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - APP_NAME=${APP_NAME:-Pashto Whisper Production API}
      - ENV_MODE=${ENV_MODE:-production}
      - DEBUG=${DEBUG:-False}
      - MERGED_MODEL_PATH=${MERGED_MODEL_PATH:-Sabtain-Dev/STT-Whisper-Pashto}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - pashto_shared_data:/workspace/workspace_data
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: pashto_whisper_frontend
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://fastapi:8000
      - API_V1_STR=${API_V1_STR:-/api/v1}
      - APP_DATA_DIR=/workspace/workspace_data
    volumes:
      - pashto_shared_data:/workspace/workspace_data
    depends_on:
      fastapi:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pashto_shared_data:
    driver: local