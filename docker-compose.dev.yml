# docker-compose.dev.yml
# Development configuration — builds container images from local Dockerfiles

services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: pashto_whisper_backend_dev
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - APP_NAME=${APP_NAME:-Pashto Whisper Dev API}
      - ENV_MODE=${ENV_MODE:-development}
      - DEBUG=${DEBUG:-True}
      - MERGED_MODEL_PATH=${MERGED_MODEL_PATH:-Sabtain-Dev/STT-Whisper-Pashto}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - pashto_shared_data:/workspace/workspace_data
    restart: "no"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: pashto_whisper_frontend_dev
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://fastapi:8000
      - API_V1_STR=${API_V1_STR:-/api/v1}
      - APP_DATA_DIR=/workspace/workspace_data
    volumes:
      - pashto_shared_data:/workspace/workspace_data
    depends_on:
      - fastapi
    restart: "no"

volumes:
  pashto_shared_data:
    driver: local